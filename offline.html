<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1427"><title>Classora • Offline lessons</title><link rel="stylesheet" href="./assets/learning-hub.css?v=79"><link rel="stylesheet" href="./assets/learning-plus.css?v=79"><style>body{margin:0;background:#080f20;color:#edf5ff;font:16px system-ui}main{max-width:850px;margin:auto;padding:20px}a{color:#9cdcff}button,select{font:inherit}h1{font-size:clamp(30px,7vw,55px)}</style></head><body><main id="offlineMain"></main><script type="module">
import {scienceTopics,scienceLiveQuestions} from './assets/learning-hub.js?v=79';
const lang=localStorage.getItem('pythagorasi_language')==='ar'?'ar':'en',L=(a,e)=>lang==='ar'?a:e,root=document.getElementById('offlineMain'),N=(tag,text)=>{const n=document.createElement(tag);if(text)n.textContent=text;return n};document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
const home=N('a',L('الرجوع إلى Classora','Back to Classora'));home.href='./';root.append(home,N('h1',L('تعلّم أينما كنت','Learn wherever you are')),N('p',L('الدروس المحفوظة متاحة دون اتصال. لا يتم حفظ علامات أو إرسال نتائج من هذه الصفحة.','Saved lessons work offline. This page does not save grades or submit results.')));
const list=N('div'),view=N('section');list.className='plus-grid';view.className='plus-panel';root.append(list,view);
for(const topic of scienceTopics){const b=N('button',topic.title[lang==='ar'?0:1]);b.type='button';b.className='hub-button';b.onclick=()=>{view.replaceChildren(N('h2',topic.title[lang==='ar'?0:1]),N('p',topic.lesson[lang==='ar'?0:1]),N('p',topic.example[lang==='ar'?0:1]));const q=scienceLiveQuestions(1,lang,topic.id)[0];if(!q)return;view.append(N('h3',q.prompt));const feedback=N('p');feedback.setAttribute('role','status');for(const option of q.options){const a=N('button',option);a.className='hub-button';a.type='button';a.onclick=()=>{feedback.textContent=(option===q.answer?L('صحيح. ','Correct. '):L('الإجابة: ','Answer: ')+q.answer+'. ')+q.explanation;view.querySelectorAll('button').forEach(x=>x.disabled=true)};view.append(a)}view.append(feedback);view.scrollIntoView({behavior:'smooth',block:'start'})};list.append(b)}
const math=N('button',L('فيثاغورس','Pythagoras'));math.className='hub-button';math.onclick=()=>view.replaceChildren(N('h2',L('نظرية فيثاغورس','Pythagorean theorem')),N('p',L('في المثلث القائم: a²+b²=c² حيث c هو الوتر. مثال: a=3، b=4، إذن c=√25=5.','In a right triangle: a²+b²=c², where c is the hypotenuse. Example: a=3, b=4, so c=√25=5.')));list.prepend(math);
const periodic=N('a',L('جدول العناصر المحفوظ','Saved periodic table'));periodic.href='./chemistry/periodic-table.html';root.append(periodic);
</script></body></html>

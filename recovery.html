<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06101b">
<title>Classora Recovery</title>
<style>
html,body{margin:0;min-height:100%;background:#06101b;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center}
main{width:min(520px,90vw);text-align:center}
.logo{font-size:46px;font-weight:900;margin-bottom:12px}
p{color:#b8c7d9;line-height:1.6}
a{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:14px;background:#1f7cff;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main>
<div class="logo">Classora</div>
<p id="status">Refreshing Classora…</p>
<a id="openBtn" href="/?recovery=85" style="display:none">Open Classora</a>
</main>
<script>
(async()=>{
  const status=document.getElementById("status"),btn=document.getElementById("openBtn");
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith("classora-")).map(k=>caches.delete(k)));
    }
    status.textContent="Classora refreshed. Opening the latest version…";
    location.replace("/?recovery=85&t="+Date.now());
  }catch(e){
    status.textContent="Recovery finished. Tap below to open Classora.";
    btn.style.display="inline-block";
    btn.href="/?recovery=85&t="+Date.now();
  }
})();
</script>
</body>
</html>
